<!doctype html>
<html lang="uk">
  <head>

  <body data-page="home">
    <div id="site-header"></div>
    <main>
      <section class="home-hero">
        <div class="container">
          <div class="hero-plate armored-plate row align-items-center g-4 g-lg-5">
            <div class="col-lg-6 hero-copy">
              <p class="eyebrow"><span class="lamp-light" aria-hidden="true"></span> <span data-i18n="homeEyebrow">Ковальня · Пруссія · 1928</span></p>
              <h1><span data-i18n="heroFirst">Залізо.</span><br><span data-i18n="heroSecond">Пара.</span><br><span data-i18n="heroThird">Воля.</span></h1>

              <a class="btn btn-primary btn-lg" href="catalog.html"><span data-i18n="shopNow">Знайти своє спорядження</span> <span aria-hidden="true">→</span></a>

            </div>
            <div class="col-lg-6">
              <figure class="hero-art mb-0">
                <span class="plate-stamp" aria-hidden="true">№ 01<br>GS</span>
                <img src="static/images/Grimbart.webp" alt="Механічний ходок із латунними деталями на зимовому полі" data-i18n-alt="heroImageAlt">
                <figcaption><span data-i18n="heroSeries">Серія «Північ»</span> <span data-i18n="heroCaption">Залізний ходок · ручне складання</span></figcaption>
              </figure>
            </div>
          </div>
        </div>
      </section>

      <section class="container featured-section" aria-labelledby="featured-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="featuredEyebrow">З майстерні</p>
            <h2 id="featured-heading" data-i18n="featuredTitle">Вибір майстра</h2>
          </div>
          <a class="text-link" href="catalog.html"><span data-i18n="allProducts">Усі вироби</span> <span aria-hidden="true">→</span></a>
        </div>
        <div id="featured-products" class="row g-4" aria-live="polite">
          <div class="col-12"><p class="text-secondary">Завантажуємо вироби…</p></div>
        </div>
